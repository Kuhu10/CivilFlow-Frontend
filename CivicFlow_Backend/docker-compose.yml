services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow
    ports:
      - "5432:5432"
    volumes:
      - civicflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://civicflow:civicflow@db:5432/civicflow
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "8000:8000"
    volumes:
      - civicflow_uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  civicflow_pgdata:
  civicflow_uploads:
